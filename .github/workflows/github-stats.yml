name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # -----------------------------------------
      # Checkout repository
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -----------------------------------------
      # Generate GitHub Stats
      # -----------------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=aviraltrip&show_icons=true&hide_title=false&hide_rank=true&hide=issues,followers,contribs&include_all_commits=true&theme=github_dark&bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9&icon_color=58a6ff&border_color=30363d
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------
      # Generate custom Top Languages SVG
      # -----------------------------------------
      - name: Generate Custom Top Languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import html

          USERNAME = "aviraltrip"
          TOKEN = os.environ["GITHUB_TOKEN"]

          API = "https://api.github.com"

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "aviraltrip-github-stats"
          }

          def github_get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode("utf-8"))

          # -----------------------------------------
          # Get all public repositories
          # -----------------------------------------
          repos = []

          page = 1

          while True:
              url = (
                  f"{API}/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}"
                  f"&type=owner&sort=updated"
              )

              data = github_get(url)

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          # -----------------------------------------
          # Collect language byte counts
          # -----------------------------------------
          language_bytes = {}

          for repo in repos:
              # Ignore forks
              if repo.get("fork"):
                  continue

              owner = repo["owner"]["login"]
              name = repo["name"]

              try:
                  languages = github_get(
                      f"{API}/repos/{owner}/{urllib.parse.quote(name)}/languages"
                  )

                  for language, amount in languages.items():
                      language_bytes[language] = (
                          language_bytes.get(language, 0) + amount
                      )

              except Exception as error:
                  print(f"Skipping {name}: {error}")

          # -----------------------------------------
          # Sort languages by usage
          # -----------------------------------------
          sorted_languages = sorted(
              language_bytes.items(),
              key=lambda item: item[1],
              reverse=True
          )

          # Keep top 6
          top_languages = sorted_languages[:6]

          total_bytes = sum(language_bytes.values())

          if total_bytes == 0:
              top_languages = [
                  ("JavaScript", 1)
              ]
              total_bytes = 1

          languages = []

          for language, amount in top_languages:
              percentage = (amount / total_bytes) * 100

              languages.append({
                  "name": language,
                  "percentage": percentage
              })

          # -----------------------------------------
          # Language colors
          # -----------------------------------------
          colors = {
              "JavaScript": "#f1e05a",
              "TypeScript": "#3178c6",
              "Python": "#3572A5",
              "HTML": "#e34c26",
              "CSS": "#563d7c",
              "C++": "#f34b7d",
              "C": "#555555",
              "Go": "#00ADD8",
              "Java": "#b07219",
              "Dart": "#00B4AB",
              "Rust": "#dea584",
              "PHP": "#4F5D95",
              "Shell": "#89e051",
              "Kotlin": "#A97BFF",
              "Swift": "#F05138",
              "Ruby": "#701516",
              "Jupyter Notebook": "#DA5B0B",
              "Vue": "#41b883",
              "SCSS": "#c6538c",
              "C#": "#178600"
          }

          default_color = "#8b949e"

          # -----------------------------------------
          # SVG settings
          # -----------------------------------------
          width = 300
          height = 210

          background = "#0d1117"
          title_color = "#58a6ff"
          text_color = "#c9d1d9"

          # Combined progress bar
          bar_x = 6
          bar_y = 64
          bar_width = 288
          bar_height = 9

          # -----------------------------------------
          # Build progress bar
          # -----------------------------------------
          bar_parts = []
          current_x = bar_x

          for index, language in enumerate(languages):
              percentage = language["percentage"]

              segment_width = bar_width * percentage / 100

              # Avoid tiny rendering issues
              if index == len(languages) - 1:
                  segment_width = (bar_x + bar_width) - current_x

              color = colors.get(language["name"], default_color)

              radius = 0

              if index == 0 or index == len(languages) - 1:
                  radius = 5

              if index == 0:
                  bar_parts.append(
                      f'<rect x="{current_x:.2f}" y="{bar_y}" '
                      f'width="{segment_width:.2f}" height="{bar_height}" '
                      f'fill="{color}" rx="5" ry="5"/>'
                  )
              else:
                  bar_parts.append(
                      f'<rect x="{current_x:.2f}" y="{bar_y}" '
                      f'width="{segment_width:.2f}" height="{bar_height}" '
                      f'fill="{color}"/>'
                  )

              current_x += segment_width

          # -----------------------------------------
          # Build language labels
          # -----------------------------------------
          label_parts = []

          left_x = 6
          right_x = 174

          start_y = 103
          row_gap = 29

          for index, language in enumerate(languages):
              column = index % 2
              row = index // 2

              x = left_x if column == 0 else right_x
              y = start_y + (row * row_gap)

              name = html.escape(language["name"])
              percentage = language["percentage"]

              color = colors.get(language["name"], default_color)

              label_parts.append(
                  f'''
                  <circle
                    cx="{x}"
                    cy="{y - 4}"
                    r="5"
                    fill="{color}"
                  />

                  <text
                    x="{x + 13}"
                    y="{y}"
                    class="lang"
                  >{name} {percentage:.2f}%</text>
                  '''
              )

          # -----------------------------------------
          # Create SVG
          # -----------------------------------------
          svg = f'''<svg
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Most Used Languages"
          >

            <style>
              .header {{
                font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
                fill: {title_color};
              }}

              .lang {{
                font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif;
                fill: {text_color};
              }}
            </style>

            <rect
              x="0"
              y="0"
              width="{width}"
              height="{height}"
              rx="5"
              fill="{background}"
            />

            <text
              x="6"
              y="35"
              class="header"
            >Most Used Languages</text>

            <!-- Combined language progress bar -->
            <rect
              x="{bar_x}"
              y="{bar_y}"
              width="{bar_width}"
              height="{bar_height}"
              rx="5"
              fill="#30363d"
            />

            {''.join(bar_parts)}

            <!-- Language labels -->
            {''.join(label_parts)}

          </svg>
          '''

          # -----------------------------------------
          # Write SVG
          # -----------------------------------------
          os.makedirs("profile", exist_ok=True)

          with open("profile/top-langs.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          print("Generated profile/top-langs.svg")

          print("\nLanguages:")
          for language in languages:
              print(
                  f"{language['name']}: "
                  f"{language['percentage']:.2f}%"
              )
          PY

      # -----------------------------------------
      # Commit generated files
      # -----------------------------------------
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git commit -m "Update GitHub stats" || exit 0

          git push
